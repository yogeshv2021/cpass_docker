{% extends "layout.html" %}

{% block body %}

  {% if session.logged_in %}

    <form action="{{ url_for('save_add_instance_config',server=server) }}" method=post class=entries>
      <dl>
        <dt><h2>Load Configuration:</h2></br>
        <dt>{{headings[0]}}</br></br>

    <div>

       <label for="product name">Product Name</label></br>
       <select id="product_name" name="product_name" class="input" value="" required>
         {% for product in products %}
           <option value="{{ product }}">{{ product }}</option>
         {% endfor %}
      </select>

       <label for="instance name">Instance Name</label></br>
       <input type="text" class="input" id="instance_name" name="instance_name" placeholder="Enter Name of your Product Instance"  value="" required></br>

       <label for="starter script" class="ami">Starter Script<div>eg:- cd /opt/product/testteam/rrbs/instance1;bash run.sh</div></label></br>
       <input type="text" class="input" id="starter_script" name="starter_script" placeholder="Enter Starter Script to start the Instance"  value="" required></br>

       <label for="instance logger">Instance Logger Path</label></br>
       <input type="text" class="input" id="instance_logger" name="instance_logger" placeholder="Enter Logger Path of the Instance"  value="" required></br>


       <label for="dynamic delete mode">Dynamic Delete Mode</label>

       <select id="dynamic_delete_mode" name="dynamic_delete_mode" class="input" value="" required>
         <option value="0">Disable</option>
         <option value="1">Enable</option>
      </select>

       <label for="delete file count">File Count not to be deleted if dynamic delete mode active</label></br>
       <input type="text" class="input" id="delete_file_count" name="delete_file_count" placeholder="Enter Number of Files to be remained"  value="" required></br>

       <hr color="gray">
       <h2>Other Configuration Values</h2></br>
       <hr color="gray">

       <label for="server name">Server Name</label></br>
       <input type="text" class="input_read_only" id="server_name" name="server_name" placeholder="server_name"  value="{{instance_config[0]}}" readonly></br>

       <label for="server type">Server Type</label></br>
       <input type="text" class="input_read_only" id="server_type" name="server_type" placeholder="server_type"  value="{{instance_config[2]}}" readonly></br>

       <label for="user name">User Name of Server</label></br>
       <input type="text" class="input_read_only" id="user_name" name="user_name" placeholder="user_name"  value="{{instance_config[3]}}" readonly></br>

       <label for="wait time">Wait time after starting product instance</label></br>
       <input type="text" class="input_read_only" id="wait_time" name="wait_time" placeholder="wait_time"  value="{{instance_config[4]}}" readonly></br>

       <label for="time interval">Time Interval between stats capturing</label></br>
       <input type="text" class="input_read_only" id="time_interval" name="time_interval" placeholder="time_interval"  value="{{instance_config[5]}}" readonly></br>

       <label for="load stats path">Load Statistics Path</label></br>
       <input type="text" class="input_read_only" id="load_stats_path" name="load_stats_path" placeholder="load_stats_path"  value="{{instance_config[6]}}" readonly></br>

       <label for="server id">Server ID</label></br>
       <input type="text" class="input_read_only" id="server_id" name="server_id" placeholder="server_id"  value="{{instance_config[7]}}" readonly></br>

       <label for="server mode">Server Mode</label>
       <input type="text" class="input_read_only" id="server_mode" name="server_mode" placeholder="server_mode"  value="{{instance_config[8]}}" readonly></br>

       <label for="delete frequency">Log File Delete Frequency Interval</label></br>
       <input type="text" class="input_read_only" id="delete_frequency" name="delete_frequency" placeholder="delete_frequency"  value="{{instance_config[9]}}" readonly></br>

        <input type=submit class="button" value=Add>

    </div>

      </dl>
    </form>

  {% endif %}

{% endblock %}
