{% extends "layout.html" %}

{% block body %}

  {% if session.logged_in %}

    <form action="{{ url_for('save_delete_instance_config') }}" method=post class=entries>
      <dl>
        <dt><h2>Load Configuration:</h2></br>
        <dt>{{headings[0]}}</br></br>

       {% for key,value in entries.items() %}

         {% set server_product_instance_list = key.split(';') %}

          <dd><input type="radio" name="load_instance" value="{{key}}"><b>{{ server_product_instance_list[2] }}</b></br></br>
       {% endfor %}

        <dd><input type=submit class="button" value=Select>

      </dl>
    </form>

  {% endif %}

{% endblock %}
