{% extends "layout.html" %}

{% block body %}

  {% if session.logged_in %}

    <form name="myform" action="{{ url_for('save_add_scenario_config',server=server) }}" method=post class=entries>
      <dl>
        <dt><h2>Load Configuration:</h2></br>
        <dt>{{headings[0]}}</br></br>

    <div>

       <label for="simulator name">Simulator Type</label></br>
       <select id="simulator_name" name="simulator_name" class="input" value="" onchange=showHideMGTSSeagullDiv(this.value) required>
           <option value="none">--select--</option>
         {% for simulator in simulators %}
           <option value="{{ simulator }}">{{ simulator }}</option>
         {% endfor %}
      </select>

       <label for="product name">Simulator Product</label></br>
       <select id="product_name" name="product_name" class="input" value="" required>
           <option value="none">--select--</option>
         {% for product in products %}
           <option value="{{ product }}">{{ product }}</option>
         {% endfor %}
      </select>

       <label for="scenario name">Scenario Name</label></br>
       <input type="text" class="input" id="scenario_name" name="scenario_name" placeholder="Enter Name of the scenario"  value="" required></br>

       <label for="starter script" class="ami">Starter Script<div>eg:- seagull -bg url config scenario logfile -lLevel E; MGTS Statemchine Name,etc</div></label></br>
       <input type="text" class="input" id="starter_script" name="starter_script" placeholder="Enter Starter Script to start the Scenario"  value="" required></br>

       <label for="call rate">Call Rate</label></br>
       <input type="text" class="input" id="call_rate" name="call_rate" placeholder="Enter Call Rate of the scenario"  value="" required></br>

       <div id="MGTS" style="display:none">

         <label for="scenario type">Scenario Type - Mandatory or Optional</label></br>

         <select id="scenario_type" name="scenario_type" class="input" value="" onchange='showMGTSTimesTimeout("mgts_times_timeout",this.value,"scenario_times","scenario_timeout")' required>

            <option value="none">--select--</option>
            <option value="mandatory">mandatory</option>
            <option value="optional">optional</option>

         </select>

         <div id="mgts_times_timeout" style="display:none">

         <label for="scenario times">Number of Times to Execute Mandatory Scenario</label></br>
         <input type="text" class="input" id="scenario_times" name="scenario_times" placeholder="scenario_times"  value="4" required></br>

         <label for="scenario timeout">Timeout of the Scenario</label></br>
         <input type="text" class="input" id="scenario_timeout" name="scenario_timeout" placeholder="scenario_timeout"  value="30" required></br>

         </div>

      </div>

       <div id="SEAGULL" style="display:none">

         <label for="scenario url">Scenario URL</label></br>
         <input type="text" class="input" id="scenario_url" name="scenario_url" placeholder="Enter Scenario URL"  value="Enter Scenario URL" required></br>

      </div>

      {% if scenario_config[1]=="SEAGULL" %}
         <label for="stats file">Scenario Stats File</label></br>
         <input type="text" class="input" id="stats_file" name="stats_file" placeholder="stats_file"  value="Enter Scenario Stats File" required></br>
      {% endif %}

       <label for="scenario mode">Scenario Mode</label></br>
       <select id="scenario_mode" name="scenario_mode" class="input" value="" onchange='showHideOnState("SCENARIO_SUB_MODE",this.value)' required>
           <option value="none">--select--</option>
           <option value="STATEFULL">STATEFULL</option>
           <option value="STATELESS">STATELESS</option>
      </select>

       <div id="SCENARIO_SUB_MODE" style="display:none">

           <label for="initial count">Number of Initial Request</label></br>
           <input type="text" class="input" id="initial_count" name="initial_count" placeholder="Enter Number of Initial Requests of the scenario"  value="" required></br>

           <label for="update count">Number of Update Request</label></br>
           <input type="text" class="input" id="update_count" name="update_count" placeholder="Enter Number of Update Requests of the scenario"  value="" required></br>

           <label for="terminate count">Number of Terminate Request</label></br>
           <input type="text" class="input" id="terminate_count" name="terminate_count" placeholder="Enter Number of Terminate Requests of the scenario"  value="" required></br>

           <label for="onhold time">Onhold Time of the Scenario</label></br>
           <input type="text" class="input" id="onhold_time" name="onhold_time" placeholder="Enter On-hold Time of the scenario"  value="" required></br>
       </div>


       <hr color="gray">
       <h2>Other Configuration Values</h2></br>
       <hr color="gray">


       <label for="server name">Server</label></br>
       <input type="text" class="input_read_only" id="server_name" name="server_name" placeholder="server_name"  value="{{scenario_config[0]}}" readonly></br>

       <label for="server type">Server Type</label></br>
       <input type="text" class="input_read_only" id="server_type" name="server_type" placeholder="server_type"  value="{{scenario_config[3]}}" readonly></br>

       <label for="user name">User Name of Server</label></br>
       <input type="text" class="input_read_only" id="user_name" name="user_name" placeholder="user_name"  value="{{scenario_config[4]}}" readonly></br>

       <label for="server id">Server ID</label></br>
       <input type="text" class="input_read_only" id="server_id" name="server_id" placeholder="server_id"  value="{{scenario_config[5]}}" readonly></br>

       <label for="wait time">Sleep interval between scenarios</label></br>
       <input type="text" class="input_read_only" id="wait_time" name="wait_time" placeholder="wait_time"  value="{{scenario_config[6]}}" readonly></br>

       <label for="time interval">Global Library Path to Execute Scenarios</label></br>
       <input type="text" class="input_read_only" id="time_interval" name="time_interval" placeholder="time_interval"  value="{{scenario_config[7]}}" readonly></br>

       <label for="shelf name">Shelf Name</label></br>
       <input type="text" class="input_read_only" id="shelf_name" name="shelf_name" placeholder="shelf_name"  value="{{scenario_config[8]}}" readonly></br>

       <label for="assignment name">Assignment Name</label></br>
       <input type="text" class="input_read_only" id="assignment_name" name="assignment_name" placeholder="assignment_name"  value="{{scenario_config[9]}}" readonly></br>

       <label for="sequence group">Sequence Group Name</label>
       <input type="text" class="input_read_only" id="seq_group" name="seq_group" placeholder="seq_group"  value="{{scenario_config[10]}}" readonly></br>

       <label for="node name">Node Name</label></br>
       <input type="text" class="input_read_only" id="node_name" name="node_name" placeholder="node_name"  value="{{scenario_config[11]}}" readonly></br>

       <label for="seq group bkp">Sequence Group Backup Path</label></br>
       <input type="text" class="input_read_only" id="seq_grp_bkp" name="seq_grp_bkp" placeholder="seq_grp_bkp"  value="{{scenario_config[12]}}" readonly></br>

        <input type=submit class="button" value=Add>

       </div>



      </dl>
    </form>

  {% endif %}

{% endblock %}
